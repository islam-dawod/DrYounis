# Cloudflare Pages + Functions config for younisclinic.com
# The static site is the repo root; server code lives in /functions.
name = "dryounis"
compatibility_date = "2025-11-01"

# D1 database binding — exposed to Functions as env.DB.
# After `wrangler d1 create younis-crm`, paste the returned database_id below,
# and add the SAME binding in the Pages dashboard (Settings → Functions → D1).
[[d1_databases]]
binding = "DB"
database_name = "younis-crm"
database_id = "16ff51a5-37d4-4c17-89b9-c99c19ada382"
